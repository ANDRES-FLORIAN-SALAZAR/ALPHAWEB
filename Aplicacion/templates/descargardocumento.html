{% extends 'base.html' %}

{% block content %}
    <h2>Descargar Documento</h2>
    <p>¿Deseas descargar el documento <strong>{{ documento.nombre }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Descargar</button>
        <a href="{% url 'lista_documentos' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
