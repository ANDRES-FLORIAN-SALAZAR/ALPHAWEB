<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Página No Encontrada</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a; /* Fondo oscuro */
            color: #e0e0e0; /* Texto claro */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #2c2c2c; /* Contenedor un poco más claro */
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); /* Sombra cyan tipo hacker */
            border: 1px solid rgba(0, 255, 255, 0.5);
        }
        h1 {
            font-size: 10em;
            margin: 0;
            color: #ff4d4d; /* Rojo para el 404 */
            text-shadow: 0 0 10px #ff4d4d;
        }
        h2 {
            font-size: 2em;
            color: #00ffff; /* Cyan para el subtítulo */
            margin-top: 0;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        a {
            color: #00ffff;
            text-decoration: none;
            border: 1px solid #00ffff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #00ffff;
            color: #1a1a1a;
        }
        .glitch-image {
            width: 150px; /* Ajusta según tu imagen */
            height: auto;
            margin-bottom: 20px;
            /* Considera añadir un efecto glitch con CSS/JS si quieres ir más allá */
        }
    </style>
</head>
<body>
    <div class="container">

    </div>
